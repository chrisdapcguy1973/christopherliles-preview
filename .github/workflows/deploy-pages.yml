name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Restore binary site files
        run: |
          set -euo pipefail
          if [ ! -f site.SHA256SUMS ]; then
            echo "FAIL: missing site.SHA256SUMS" >&2
            exit 1
          fi
          found=0
          while IFS= read -r -d '' f; do
            found=$((found + 1))
            out="${f%.b64}"
            base64 --decode "$f" > "$out"
            rm -f "$f"
          done < <(find site -type f -name '*.b64' -print0)
          if [ "$found" -eq 0 ]; then
            echo "FAIL: no site/**/*.b64 files to restore" >&2
            exit 1
          fi
          echo "restored $found binary file(s)"
          expected=$(grep -c . site.SHA256SUMS)
          [ "$found" -eq "$expected" ] || { echo "FAIL: restored $found but SUMS lists $expected" >&2; exit 1; }
          sha256sum -c site.SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
